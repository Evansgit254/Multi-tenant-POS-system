services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------------------
  - type: pgo
    name: m-forge-db
    plan: free # Note: Free DBs expire in 30 days unless upgraded
    databaseName: pos_db
    user: mforge_user

  # ----------------------------------------------------
  # 2. Node.js Backend API
  # ----------------------------------------------------
  - type: web
    name: m-forge-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: m-forge-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        # Render will populate this with the exact backend URL; you will update it to the frontend URL later if needed.
        value: "*"
      # Security Keys (Replace these manually in the Render Dashboard after deployment)
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: MPESA_WEBHOOK_SECRET
        generateValue: true

  # ----------------------------------------------------
  # 3. React Vite Frontend
  # ----------------------------------------------------
  - type: web
    name: m-forge-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        # We must link this to the backend Web Service automatically
        fromService:
          type: web
          name: m-forge-server
          envVarKey: RENDER_EXTERNAL_URL
